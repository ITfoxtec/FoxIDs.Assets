apiVersion: v1
kind: PersistentVolume
metadata:
  name: opensearch-data-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  hostPath:
    # local directory c:\data\foxids-data\opensearch on Docker Desktop host machine
    path: "/run/desktop/mnt/host/c/data/foxids-data/opensearch"
    type: ""
